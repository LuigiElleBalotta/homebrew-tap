name: Update cask

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  # mcp-hub's release workflow can trigger this right after publishing.
  repository_dispatch:
    types: [mcp-hub-release]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update the cask to the latest mcp-hub release
        run: python scripts/update_cask.py

      - name: Commit
        run: |
          if git diff --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          VERSION=$(sed -n 's/^ *version "\(.*\)"/\1/p' Casks/mcp-hub.rb | head -1)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "mcp-hub ${VERSION}"
          git push
